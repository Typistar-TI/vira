name: Deploy Vira

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vira-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types and Astro
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CONFIG_ENCRYPTION_KEY" || { echo 'Missing CONFIG_ENCRYPTION_KEY'; exit 1; }
          node --input-type=module -e 'if (Buffer.from(process.env.CONFIG_ENCRYPTION_KEY, "base64").length !== 32) process.exit(1)'

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:remote

      - name: Configure sign-in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npm run config:remote -- GOOGLE_CLIENT_ID
          fi
          if [ -n "$ADMIN_EMAIL" ]; then
            printf '%s' "$ADMIN_EMAIL" | npm run admin:remote
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npm run config:remote -- RESEND_API_KEY
          fi
          if [ -n "$AUTH_EMAIL_FROM" ]; then
            printf '%s' "$AUTH_EMAIL_FROM" | npm run config:remote -- AUTH_EMAIL_FROM
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(`${process.env.RUNNER_TEMP}/vira-worker-secrets.json`, JSON.stringify({ CONFIG_ENCRYPTION_KEY: process.env.CONFIG_ENCRYPTION_KEY }), { mode: 0o600 })'
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/vira-worker-secrets.json"
